name: Mythos Client Mod

on:
  push:
    paths: ["mythos-mod/**", ".github/workflows/mod.yml"]
  pull_request:
    paths: ["mythos-mod/**", ".github/workflows/mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mythos-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mythos-client-mod
          path: mythos-mod/build/libs/*.jar
