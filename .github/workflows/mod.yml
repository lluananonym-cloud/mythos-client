name: Mythos Client Mod

on:
  push:
    paths: ["mythos-mod/**", ".github/workflows/mod.yml", "supabase/**"]
  pull_request:
    paths: ["mythos-mod/**", ".github/workflows/mod.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mythos-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Adresse des Mythos-Servers eintragen
        working-directory: .
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && REF=$(.github/scripts/mythos-server.sh ref); then
            echo "api.url=https://$REF.supabase.co/functions/v1/mcc" > mythos-mod/src/main/resources/mythos.properties
          fi
      - run: chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mythos-client-mod
          path: mythos-mod/build/libs/*.jar
