name: Mythos Server

# Stellt das eigene Supabase-Projekt bereit: Datenbank-Migrationen und Edge Function "mcc".
# Braucht nur das Repository-Secret SUPABASE_ACCESS_TOKEN.
on:
  push:
    paths: ["supabase/**", ".github/workflows/server.yml", ".github/scripts/mythos-server.sh"]
  workflow_dispatch:

concurrency: mythos-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Secret vorhanden?
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN fehlt, Mythos-Server wird nicht bereitgestellt."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.skip != 'true'
        with:
          version: latest
      - name: Datenbank
        if: steps.check.outputs.skip != 'true'
        run: .github/scripts/mythos-server.sh migrate
      - name: Edge Function mcc
        if: steps.check.outputs.skip != 'true'
        run: |
          REF=$(.github/scripts/mythos-server.sh ref)
          supabase functions deploy mcc --project-ref "$REF" --no-verify-jwt
          echo "Mythos-Server: https://$REF.supabase.co/functions/v1/mcc" >> "$GITHUB_STEP_SUMMARY"
