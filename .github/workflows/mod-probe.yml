name: Mod Probe

# Hilfsjob für die Portierung: sucht passende Versionen für Minecraft 1.21.11 und zeigt Signaturen.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Versionen
        run: |
          MC=1.21.11
          echo "yarn: $(curl -fsS https://meta.fabricmc.net/v2/versions/yarn/$MC | jq -r '.[0].version')"
          echo "loader: $(curl -fsS https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable)][0].version')"
          echo "loom: $(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep -v -- '-' | tail -3 | tr '\n' ' ')"
          echo "loom-snap: $(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*SNAPSHOT</version>' | sed 's/<[^>]*>//g' | tail -3 | tr '\n' ' ')"
          echo "fabric-api: $(curl -fsS https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -o "<version>[^<]*+$MC</version>" | sed 's/<[^>]*>//g' | tail -2 | tr '\n' ' ')"
